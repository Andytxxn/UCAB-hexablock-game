name: Conventions

# Server-side copy of the local git hooks: the one check nobody can skip.
on:
  pull_request:
    branches: [main, develop]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HEAD_REF: ${{ github.head_ref }}
      BASE_REF: ${{ github.base_ref }}
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Harness self-test
        run: sh .githooks/test.sh && node .claude/hooks/test.mjs

      - name: Branch flow (working branch -> develop -> main)
        run: |
          if [ "$BASE_REF" = main ]; then
            [ "$HEAD_REF" = develop ] || { echo "::error::Only develop can be merged into main."; exit 1; }
          else
            sh .githooks/check-branch "$HEAD_REF"
          fi

      - name: PR title follows Conventional Commits
        run: |
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/title"
          sh .githooks/commit-msg "$RUNNER_TEMP/title"

      - name: Every commit follows Conventional Commits
        run: |
          status=0
          for sha in $(git rev-list --no-merges "origin/$BASE_REF..HEAD"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/message"
            sh .githooks/commit-msg "$RUNNER_TEMP/message" || { echo "::error::Invalid commit $sha"; status=1; }
          done
          exit $status
